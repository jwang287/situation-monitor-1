name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build application
        env:
          BASE_PATH: '/situation-monitor-1'
          VITE_FINNHUB_API_KEY: ${{ secrets.VITE_FINNHUB_API_KEY }}
          VITE_FRED_API_KEY: ${{ secrets.VITE_FRED_API_KEY }}
        run: npm run build

      - name: Verify build output
        run: |
          echo "=== Build Directory Structure ==="
          ls -la build/
          echo ""
          echo "=== Checking for index.html ==="
          test -f build/index.html && echo "✅ index.html found" || (echo "❌ index.html missing" && exit 1)
          echo ""
          echo "=== Build Size ==="
          du -sh build/
          echo ""
          echo "=== File Count ==="
          find build -type f | wc -l

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
